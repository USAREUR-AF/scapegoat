name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tests:
    name: field-node installer tests, Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']   # Raspberry Pi OS 12 and Ubuntu 24.04; TOML needs 3.11
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: The installer's shell, driven from Python (a stand-in scapegoat binary)
        run: python -m unittest discover -s tests -t . -v

  rust:
    name: format, lints, tests, static binary
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: goat-transformers packs at the engine's pinned commit, for the output tests
        run: |
          rev=$(sed -n 's/^goat-transformers = .*rev = "\([0-9a-f]*\)".*/\1/p' Cargo.toml)
          curl -fsSL "https://codeload.github.com/USAREUR-AF/goat-transformers/tar.gz/$rev" | tar -xz -C "$RUNNER_TEMP"
          echo "GOAT_TRANSFORMERS_PATH=$RUNNER_TEMP/goat-transformers-$rev" >> "$GITHUB_ENV"
      - name: Rust formatting, lints and tests
        run: |
          rustup component add rustfmt clippy
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: The field-node installer tests with the real binary checking each rendered config
        run: |
          cargo build --locked
          SCAPEGOAT_BINARY="$PWD/target/debug/scapegoat" python3 -m unittest discover -s tests -t .
      - name: The landing page's recording gives the same seven state moves with the binary
        run: |
          SCAPEGOAT_BIN=target/debug/scapegoat python3 -I site/record.py | tee record.txt
          test "$(grep -E '^ +[a-z]+ -> [a-z]+$' record.txt | sed 's/^ *//' | tr '\n' '|')" = "disabled -> handshaking|handshaking -> establishing|establishing -> established|established -> degraded|degraded -> lost|lost -> establishing|establishing -> established|"
      - name: The static binary
        run: tools/build-bin.sh
      - name: The binary is static and its version is VERSION
        run: |
          file bin/x86_64/scapegoat | grep -qE 'static-pie linked|statically linked'
          test "$(./bin/scapegoat --version)" = "scapegoat $(cat VERSION)"

  rust-arm64:
    name: arm64 static binary
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: tools/build-bin.sh
      - run: file bin/aarch64/scapegoat | grep -qE 'static-pie linked|statically linked'
      - run: test "$(./bin/scapegoat --version)" = "scapegoat $(cat VERSION)"
