name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tests:
    name: unit tests, Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']   # Raspberry Pi OS 12 and Ubuntu 24.04; TOML needs 3.11
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Standard library only; every test, no plugin present
        run: python -m unittest discover -s tests -t . -v

  rust:
    name: Rust port, format, lints, tests, static binary
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Rust formatting, lints and tests
        run: |
          rustup component add rustfmt clippy
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: The static binary
        run: tools/build-bin.sh
      - name: The binary is static and its version is VERSION
        run: |
          file bin/x86_64/scapegoat | grep -qE 'static-pie linked|statically linked'
          test "$(./bin/scapegoat --version)" = "scapegoat $(cat VERSION)"

  rust-arm64:
    name: Rust port, arm64 static binary
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: tools/build-bin.sh
      - run: file bin/aarch64/scapegoat | grep -qE 'static-pie linked|statically linked'
      - run: test "$(./bin/scapegoat --version)" = "scapegoat $(cat VERSION)"
